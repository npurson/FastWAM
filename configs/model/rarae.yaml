_target_: fastwam.runtime.create_ra
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: null
skip_dit_load_from_pretrain: false

representation:
  target_dim: ${model.representation.codec.output_dim}
  # Baseline samples one noise timestep per sample. Diffusion-Forcing variants
  # override this with `per_frame` to sample independent [B, T] timesteps.
  noise_timestep_mode: shared
  # The dataset already samples the FastWAM 9-frame clip at action steps
  # [0,4,...,32]. The causal 2x codec keeps frame 0 as a singleton and packs
  # each following pair, producing five representation steps.
  temporal_indices: null
  temporal_groups:
    - [0]
    - [1, 2]
    - [3, 4]
    - [5, 6]
    - [7, 8]
  temporal_align_mode: strict
  # Post-codec spatial size after native-resolution cameras are encoded and
  # concatenated without mixing camera seams.
  latent_spatial_size: [12, 10]
  # DINO MLS already applies its own non-affine output LayerNorm. RAEv2's
  # ImageNet feature statistics describe the pre-codec 1024x16x16 feature and
  # are intentionally not applied to the 512-channel diffusion target.
  normalize_target: none
  decoder_path: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/checkpoints/RAEv2/decoder.pt
  encoder:
    name: dino_mls
    backend: hub
    hub_repo: facebookresearch/dinov3:main
    hub_source: github
    model_name: dinov3_vitl16
    model_id: facebook/dinov3-vitl16-pretrain-lvd1689m
    hub_kwargs: {}
    input_size: [384, 384]
    # Preserve each camera's native rectangular input. `input_size` remains a
    # compatibility fallback but is not used when resize_input=false.
    resize_input: false
    patch_size: 16
    output_dim: 1024
    norm_affine: false
    layers: [11, 13, 15, 17, 19, 21, 23]
    camera_layout: robotwin
    num_cameras: 3
  codec:
    enabled: true
    type: frozen_random
    output_dim: 128
    kernel_size: [2, 2, 2]
    stride: [2, 2, 2]
    seed: 0
    # Normalize the actual codec latent immediately before diffusion. The
    # lagged running-stat update avoids future-to-current leakage and has no
    # learnable affine scale or bias.
    latent_norm:
      enabled: true
      type: causal_running
      eps: 1.0e-05
      momentum: 0.1
    decoder:
      enabled: true
      # This decoder consumes stop-gradient raw codec latents and reconstructs
      # raw DINO MLS features. RunningNorm is only a diffusion interface.
      trainable: true
      loss_weight: 1.0

representation_dit_config:
  has_image_input: false
  patch_size: [1, 1, 1]
  in_dim: ${model.representation.target_dim}
  hidden_dim: 2048
  ffn_dim: 8192
  freq_dim: 256
  text_dim: 4096
  out_dim: ${model.representation.target_dim}
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: group_diagonal
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

representation_scheduler:
  train_shift: auto
  infer_shift: auto
  shift_base_dim: 4096
  shift_scope: future_tokens
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_representation: 1.0
  lambda_action: 1.0
