# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: rarae_joint
  - _self_

# dataloading
batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  representation:
    # LIBERO 2cam data is concatenated horizontally as [agentview | wrist].
    # Native 224x224 camera inputs yield 14x14 DINO grids and 7x7 codec grids.
    latent_spatial_size: [7, 14]
    encoder:
      camera_layout: horizontal
      num_cameras: 2

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
